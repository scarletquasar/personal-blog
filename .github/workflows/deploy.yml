name: Deploy Personal Blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  deployments: write

jobs:
  check-deploy-issue:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issues' && 
      (contains(github.event.issue.labels.*.name, 'deploy') || 
       contains(github.event.issue.title, 'deploy'))
    steps:
      - name: Trigger deployment
        run: echo "Deployment triggered by issue"

  build:
    needs: [check-deploy-issue]
    if: |
      github.event_name != 'issues' || 
      (contains(github.event.issue.labels.*.name, 'deploy') || 
       contains(github.event.issue.title, 'deploy'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build application
        run: pnpm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/client
          publish_branch: pages

